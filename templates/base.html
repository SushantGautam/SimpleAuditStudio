<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SimpleAudit{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: '#0f1117', raised: '#1a1d27', overlay: '#242836' },
            accent: { DEFAULT: '#6c8cff', hover: '#8da4ff' },
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.6"></script>
</head>
<body class="h-full bg-surface text-gray-200 antialiased">
{% if user.is_authenticated %}
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-14 md:w-52 flex flex-col bg-surface-raised border-r border-gray-800 shrink-0">
    <div class="h-14 flex items-center px-3 md:px-4 border-b border-gray-800">
      <span class="text-lg font-bold text-accent">SA</span>
      <span class="hidden md:inline ml-2 text-sm font-semibold text-gray-300">SimpleAudit</span>
    </div>
    <nav class="flex-1 py-3 space-y-0.5 px-2">
      {% url 'dashboard' as dash_url %}
      <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm {% if request.path == '/' or request.path == '/dashboard/' %}bg-accent/15 text-accent font-medium{% else %}text-gray-400 hover:text-gray-200 hover:bg-surface-overlay{% endif %}">
        <span class="text-base w-5 text-center">◉</span><span class="hidden md:inline">Dashboard</span>
      </a>
      <a href="{% url 'new_audit' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm {% if request.path == '/audits/new/' %}bg-accent/15 text-accent font-medium{% else %}text-gray-400 hover:text-gray-200 hover:bg-surface-overlay{% endif %}">
        <span class="text-base w-5 text-center">＋</span><span class="hidden md:inline">New Audit</span>
      </a>
      <a href="{% url 'queue' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm {% if request.path == '/queue/' %}bg-accent/15 text-accent font-medium{% else %}text-gray-400 hover:text-gray-200 hover:bg-surface-overlay{% endif %}">
        <span class="text-base w-5 text-center">≡</span><span class="hidden md:inline">Queue</span>
      </a>
      <a href="{% url 'scenarios' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm {% if request.path == '/scenarios/' %}bg-accent/15 text-accent font-medium{% else %}text-gray-400 hover:text-gray-200 hover:bg-surface-overlay{% endif %}">
        <span class="text-base w-5 text-center">▤</span><span class="hidden md:inline">Scenarios</span>
      </a>
      <a href="{% url 'models' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm {% if request.path == '/models/' %}bg-accent/15 text-accent font-medium{% else %}text-gray-400 hover:text-gray-200 hover:bg-surface-overlay{% endif %}">
        <span class="text-base w-5 text-center">⬡</span><span class="hidden md:inline">Models</span>
      </a>
      <a href="{% url 'compare' %}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm {% if request.path == '/compare/' %}bg-accent/15 text-accent font-medium{% else %}text-gray-400 hover:text-gray-200 hover:bg-surface-overlay{% endif %}">
        <span class="text-base w-5 text-center">⇄</span><span class="hidden md:inline">Compare</span>
      </a>
    </nav>
    <div class="p-3 border-t border-gray-800">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-full bg-accent/20 flex items-center justify-center text-xs font-bold text-accent">{{ user.username|first|upper }}</div>
        <span class="hidden md:block text-xs text-gray-400 truncate flex-1">{{ user.username }}</span>
        <a href="{% url 'logout' %}" class="hidden md:block text-xs text-gray-600 hover:text-red-400">⏻</a>
      </div>
    </div>
  </aside>
  <!-- Main -->
  <main class="flex-1 overflow-y-auto p-4 md:p-6">
    {% block content %}{% endblock %}
  </main>
</div>
{% else %}
{% block auth_content %}{% endblock %}
{% endif %}
</body>
</html>
